name: Latest book list from a goodreads

on:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/goodreads-books-workflow.yml'
      - 'scripts/update_goodreads.py'
      - 'tests/test_update_goodreads.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/goodreads-books-workflow.yml'
      - 'scripts/update_goodreads.py'
      - 'tests/test_update_goodreads.py'

permissions:
  contents: read

concurrency:
  group: goodreads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Goodreads updater
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  update-readme-with-goodreads-books:
    name: Update this repo's README with goodreads books
    needs: test
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Refresh Goodreads snapshot
        id: refresh
        env:
          GOODREADS_USER_ID: "156149291"
        run: |
          status=0
          python scripts/update_goodreads.py || status=$?
          # Exit 3 explicitly means the optional upstream feed is unavailable.
          # The updater reports a warning and preserves the previous snapshot.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
      - name: Commit and push if updated
        if: steps.refresh.outputs.status == 'updated'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update goodreads book lists"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
